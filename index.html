<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formlário Açaiajin</title>
    <link rel="stylesheet" href="_css/style.css">
</head>
<body>
    <h1>Formulário Super<strong>Açai</strong>Ajin</h1>
    <form method="get" action="confirma.html" >
        <fieldset>
            <legend>
                Dados Pessoais:
            </legend>
            <label>Nome: <p></p> <input type="text" required></label>
            <p></p>
        <label>Idade:<p></p> <input type="number" required></label>
        <p></p>
        <label>Telefone:<p></p> <input type="tel" required></label>
        <p></p>
        <label>Endereço:<p></p> <input type="text" required></label>
        <p></p>
        <label> Planeta De Origem:
            <br>
            <br>
            <select>
                <option>Planeta Terra</option>
                <option>Planeta Namek</option>
                <option>Planeta Vegeta</option>
                <option>Outros</option>
            </select>
        </label>
    </fieldset>

    <fieldset>
        <legend>
            Dados Extras:
        </legend>
        <label>Raça Do Universo 7 preferida</label>
        <select>
            <option>Terráquio</option>
            <option>Sayajin</option>
            <option>Namekuseiijin</option>
            <option>Androide</option>
            <option>Outros</option>
        </select>
    </label>
    <br>
    <br>
    <label>Trabalho:
        <input type="radio" name="cargo" value="1" checked> Autônomo
        <input type="radio" name="cargo" value="2">Empregado CLT
        <input type="radio" name="cargo" value="3">Empresário
        <input type="radio" name="cargo" value="4">Tipo Goku


    </label>
    </fieldset>
    <fieldset>
        <legend>
            Seu açaí é perfeito de que jeito?
        </legend>
        <input type="checkbox">Puro
        <input type="checkbox">Com Banana
        <input type="checkbox">Com Morango
        <input type="checkbox">Com Granola
        <input type="checkbox">Tem gosto de terra
    </fieldset>
    <fieldset>
        <legend>
            Qual o tamanho preferido?
        </legend>
        <input type="radio" name="tamanho" value="1" checked>500ml 
        <input type="radio" name="tamanho" value="2">300ml 
        <input type="radio" name="tamanho" value="3">100ml
        <input type="radio" name="tamanho" value="4">Casquinha
        <input type="radio" name="tamanho" value="5">Qual parte do gosto de terra que voce não entendeu?
    </fieldset>
    
    <fieldset>
        Observações: <br>
        <textarea cols="195" rows="10" >Escreva suas observações... Eu gosto de acaí porque...</textarea>
    </fieldset>
    <div>
        <input type="submit" value="ENVIAR">
        <input type="reset" value="LIMPAR">
    </div>


    </form> 
    
</body>
</html>
